name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is the jetpack 6 python
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install linters
        run: pip install ruff 'black<26'

      - name: Run ruff check
        run: ruff check plugins/ tests/ utils/

      - name: Run black check
        run: black --check plugins/ tests/ utils/

      # Scoped to this file on purpose: test_pipelines.py raises on import when
      # gst-launch-1.0 is missing, which would fail collection for the whole dir.
      - name: Run g2g backend tests
        run: |
          pip install pytest numpy
          pytest tests/test_g2g_backend.py -q
          pytest tests/test_support_matrix.py -q
          pytest tests/test_model_engines.py -q

  # each leg installs one engine's extra so their pins never have to agree
  engines:
    needs: lint
    # tensorflow, executorch and tensorflow-text have no wheel for 26.04's system python 3.14
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: onnx
            extra: onnx
            exported-models: true
          # optimum-intel 1.x has no nncf, pip picks it to keep a newer transformers
          - engine: openvino
            extra: openvino,onnx
            pins: "'optimum-intel>=2.2'"
            exported-models: true
          # the tensorflow pins are the ones the ultralytics export asks for
          - engine: tensorflow
            extra: tensorflow,onnx
            pins: "'tensorflow<=2.19' 'tf-keras<=2.19'"
            exported-models: true
          # the yolo export needs tensorflow
          - engine: tflite
            extra: tensorflow,litert,onnx
            pins: "'tensorflow<=2.19' 'tf-keras<=2.19'"
            exported-models: true
          - engine: ncnn
            extra: ncnn,onnx
            exported-models: true
          - engine: executorch
            extra: executorch,onnx
            exported-models: true
          - engine: iree
            extra: iree,onnx
            exported-models: true
          - engine: llamacpp
            extra: llamacpp
          - engine: tvm
            extra: tvm,onnx
            exported-models: true
          - engine: mlx
            extra: mlx-cpu
          - engine: jax
            extra: jax-cpu,onnx
            exported-models: true
          - engine: tinygrad
            extra: tinygrad,onnx
            exported-models: true
          # runs on the onnxruntime stand-in for the board's runtime
          - engine: drpai
            extra: onnx
    steps:
      - uses: actions/checkout@v6

      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.config/Ultralytics
          key: engines-${{ matrix.engine }}-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}

      - name: Install the engine
        env:
          # the cached llama.cpp wheel must run on whichever cpu the next runner has
          CMAKE_ARGS: -DGGML_NATIVE=OFF
          # the venv must hold every export requirement up front, not get rewritten under a running test
          YOLO_AUTOINSTALL: "false"
        # the gst bindings only exist on the system python
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gst-plugins-bad-1.0 \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            python3-gi python3-gst-1.0 python3-venv python3-dev \
            libcairo2-dev libgirepository-2.0-dev libglib2.0-dev pkg-config
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e ".[${{ matrix.extra }},yolo]" pytest ${{ matrix.pins }}

      - name: Run the engine tests
        env:
          MP_REQUIRE_ENGINE: ${{ matrix.engine }}
          YOLO_AUTOINSTALL: "false"
          # tensorflow's onednn kernels segfault the depth model on the runner
          TF_ENABLE_ONEDNN_OPTS: "0"
        # an engine with no test of its own makes pytest exit 5
        run: |
          .venv/bin/python -m pytest tests/test_engines.py -q -k "${{ matrix.engine }}" || [ $? -eq 5 ]
          if [ "${{ matrix.engine }}" = "onnx" ]; then
            .venv/bin/python -m pytest tests/test_onnx_devices.py -q
          fi

      - name: Run the exported model tests
        if: matrix.exported-models
        env:
          MP_REQUIRE_ENGINE: ${{ matrix.engine }}
          YOLO_AUTOINSTALL: "false"
          # tensorflow's onednn kernels segfault the depth model on the runner
          TF_ENABLE_ONEDNN_OPTS: "0"
        run: .venv/bin/python -m pytest tests/test_exported_models.py -q -k "${{ matrix.engine }}"

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.14"]
        exclude:
          # ubuntu-latest is 24.04 with system Python 3.12;
          # GStreamer gi bindings are built for 3.12 only
          - os: ubuntu-latest
            python-version: "3.14"
        include:
          - os: ubuntu-latest
            # the gst python plugin loader links the system libpython
            venv-python: /usr/bin/python3
            gst-install: |
              sudo apt-get update
              sudo apt-get install -y \
                gstreamer1.0-tools \
                gstreamer1.0-plugins-base \
                gstreamer1.0-plugins-good \
                gstreamer1.0-plugins-bad \
                gstreamer1.0-libav \
                gir1.2-gstreamer-1.0 \
                gir1.2-gst-plugins-base-1.0 \
                gir1.2-gst-plugins-bad-1.0 \
                libgstreamer-plugins-bad1.0-dev \
                mesa-vulkan-drivers \
                python3-gi \
                python3-gi-cairo \
                python3-gst-1.0 \
                python3-venv \
                gstreamer1.0-python3-plugin-loader \
                libcairo2 \
                libcairo2-dev \
                pkg-config \
                libgirepository-2.0-dev \
                libglib2.0-dev \
                python3-dev
              pip install numpy opencv-python-headless ultralytics onnxruntime
          - os: macos-latest
            gst-install: |
              brew install gstreamer cairo pkg-config pygobject3 gobject-introspection
              echo "DYLD_LIBRARY_PATH=$(brew --prefix)/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
              echo "GI_TYPELIB_PATH=$(brew --prefix)/lib/girepository-1.0" >> $GITHUB_ENV
          # windows gets gstreamer from the gstreamer-meta wheels in the venv step

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GStreamer
        if: runner.os != 'Windows'
        run: ${{ matrix.gst-install }}

      - name: Create venv and install CPU dependencies
        shell: bash
        run: |
          ${{ matrix.venv-python || 'python' }} -m venv --system-site-packages .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
            pip install "gstreamer-meta[cli]"
          else
            source .venv/bin/activate
          fi
          pip install -e ".[yolo,mqtt,mcp,audio]"

      - name: Verify core imports
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          unset LD_LIBRARY_PATH
          python -c "
          import gi
          gi.require_version('Gst', '1.0')
          gi.require_version('GstBase', '1.0')
          from gi.repository import Gst
          Gst.init(None)
          import importlib, sys
          modules = [
              'plugins.python.streammux',
              'plugins.python.streamdemux',
              'plugins.python.overlay',
              'plugins.python.engine.ml_engine',
              'plugins.python.engine.engine_factory',
          ]
          failed = []
          for m in modules:
              try:
                  importlib.import_module(m)
                  print(f'  OK  {m}')
              except Exception as e:
                  print(f'  FAIL {m}: {e}')
                  failed.append(m)
          if failed:
              print(f'\n{len(failed)} import(s) failed')
              sys.exit(1)
          print('\nAll imports OK')
          "

      - name: Check GStreamer plugin discovery (Linux)
        if: runner.os == 'Linux'
        run: |
          source .venv/bin/activate
          VENV_SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          # libgstpython.so uses system Python which needs:
          # - /usr/lib/python3/dist-packages for gi (python3-gi apt package)
          # - venv site-packages for pip-installed ML packages
          # - plugins/python for our GStreamer element modules
          export PYTHONPATH="/usr/lib/python3/dist-packages:${VENV_SITE}:${{ github.workspace }}/plugins/python"
          export GST_PLUGIN_PATH=${{ github.workspace }}/plugins
          # Prevent hostedtoolcache libpython from shadowing system libpython
          unset LD_LIBRARY_PATH
          rm -rf ~/.cache/gstreamer-1.0
          gst-inspect-1.0 python
          gst-inspect-1.0 mp_objectdetector

      - name: Run gst backend tests (Linux)
        if: runner.os == 'Linux'
        run: |
          source .venv/bin/activate
          pip install pytest
          unset LD_LIBRARY_PATH
          rm -rf ~/.cache/gstreamer-1.0
          # PIPELINES.md pipelines need the GPU and the data dir, the other two load models
          python -m pytest tests/ -q \
            --ignore=tests/test_pipelines.py \
            --ignore=tests/test_zeroshotdetector.py \
            --ignore=tests/test_engines.py
          # the g2g job has no gi to run its gst driver tests
          python -m pytest tests/test_g2g_backend.py -q

      - name: Check GStreamer plugin discovery (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          source .venv/Scripts/activate
          WS=$(pwd -W)
          VENV_SITE=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          GI_SITE=$(python -c "import os; print(os.environ['GST_PYTHONPATH_1_0'])")
          # the python plugin loader embeds the base interpreter, which sees none of the venv
          echo "PYTHONPATH=${VENV_SITE};${GI_SITE};${WS}/plugins/python" >> $GITHUB_ENV
          # the gstreamer wheels set GST_PLUGIN_PATH_1_0, which hides GST_PLUGIN_PATH
          echo "GST_PLUGIN_PATH_1_0=${WS}/plugins" >> $GITHUB_ENV
          export PYTHONPATH="${VENV_SITE};${GI_SITE};${WS}/plugins/python"
          export GST_PLUGIN_PATH_1_0="${WS}/plugins"
          # the import check above cached a registry without the plugins dir
          rm -rf .venv/Temp/gstreamer-1.0
          gst-inspect-1.0 python
          gst-inspect-1.0 mp_objectdetector

      - name: Run gst backend tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          source .venv/Scripts/activate
          # mp_overlay draws with skia on windows
          pip install pytest -e ".[skia]"
          rm -rf .venv/Temp/gstreamer-1.0
          python -m pytest tests/ -q \
            --ignore=tests/test_pipelines.py \
            --ignore=tests/test_zeroshotdetector.py \
            --ignore=tests/test_engines.py

      - name: Cache the models the tests download
        if: runner.os != 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.config/Ultralytics
            ~/AppData/Roaming/Ultralytics
          key: pipelines-${{ runner.os }}-${{ hashFiles('PIPELINES.md', 'tests/test_exported_models.py') }}

      # the alert pipeline publishes to a local broker
      - name: Run the PIPELINES.md pipelines a headless runner can (Linux)
        if: runner.os == 'Linux'
        run: |
          source .venv/bin/activate
          unset LD_LIBRARY_PATH
          sudo apt-get install -y mosquitto
          HEADLESS_PIPELINES=1 PIPELINE_TIMEOUT=300 GST_DEBUG=2 python -m pytest tests/test_pipelines.py -q

      - name: Run the PIPELINES.md pipelines a headless runner can (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          source .venv/Scripts/activate
          HEADLESS_PIPELINES=1 PIPELINE_TIMEOUT=300 GST_DEBUG=2 python -m pytest tests/test_pipelines.py -q

      - name: Upload the pipeline logs
        if: runner.os != 'macOS' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-logs-${{ matrix.os }}-${{ matrix.python-version }}
          path: tests/logs

      # the gst backend step has no onnxruntime
      - name: Run the exported model tests (Linux)
        if: runner.os == 'Linux'
        run: |
          source .venv/bin/activate
          unset LD_LIBRARY_PATH
          pip install -e ".[onnx]"
          python -m pytest tests/test_exported_models.py -q

      - name: ONNX pipeline smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          source .venv/bin/activate
          pip install onnxruntime
          VENV_SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          export PYTHONPATH="/usr/lib/python3/dist-packages:${VENV_SITE}:${{ github.workspace }}/plugins/python"
          export GST_PLUGIN_PATH=${{ github.workspace }}/plugins
          unset LD_LIBRARY_PATH
          rm -rf ~/.cache/gstreamer-1.0
          # Export YOLO model to ONNX
          python -c "from ultralytics import YOLO; YOLO('yolo11n.pt').export(format='onnx')"
          # Run 2-frame smoke test with synthetic source (avoids codec deps)
          gst-launch-1.0 videotestsrc num-buffers=2 \
            ! "video/x-raw,format=RGB,width=640,height=640" \
            ! mp_objectdetector engine-name=onnx model-name=yolo11n.onnx device=cpu input-format=nchw post-process=anchor_free \
            ! fakesink

      - name: GStreamer plugin smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          # libgstpython embeds the python@ formula gstreamer depends on, not brew's python3
          GST_PYTHON_FORMULA=$(brew deps --direct gstreamer | grep '^python@')
          BREW_PYTHON="$(brew --prefix "${GST_PYTHON_FORMULA}")/bin/python${GST_PYTHON_FORMULA#python@}"
          ${BREW_PYTHON} -m pip install --break-system-packages numpy
          export GST_PLUGIN_PATH=${{ github.workspace }}/plugins
          export PYTHONPATH=${{ github.workspace }}/plugins/python
          gst-inspect-1.0 python
          gst-inspect-1.0 mp_metasink
          gst-launch-1.0 videotestsrc num-buffers=2 \
            ! "video/x-raw,format=RGB,width=64,height=48" \
            ! mp_metasink

      - name: ONNX pipeline smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          source .venv/Scripts/activate
          pip install onnxruntime
          python -c "from ultralytics import YOLO; YOLO('yolo11n.pt').export(format='onnx')"
          gst-launch-1.0 videotestsrc num-buffers=2 \
            ! "video/x-raw,format=RGB,width=640,height=640" \
            ! mp_objectdetector engine-name=onnx model-name=yolo11n.onnx device=cpu input-format=nchw post-process=anchor_free \
            ! fakesink
